    <script>
      if (typeof globalThis !== 'undefined' && globalThis.crypto && !globalThis.crypto.randomUUID) {
        globalThis.crypto.randomUUID = function () {
          var b = new Uint8Array(16);
          globalThis.crypto.getRandomValues(b);
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          function h(n) { return n.toString(16).padStart(2, '0'); }
          return h(b[0])+h(b[1])+h(b[2])+h(b[3])+'-'+h(b[4])+h(b[5])+'-'+h(b[6])+h(b[7])+'-'+h(b[8])+h(b[9])+'-'+h(b[10])+h(b[11])+h(b[12])+h(b[13])+h(b[14])+h(b[15]);

      .markdown-content h1 {

        color: var(--slate-900) !important;

        line-height: 1.4 !important;
        text-transform: none !important;
      }
      .markdown-content h3 {

        font-weight: 700 !important;
        margin-top: 1.25rem !important;
        margin-bottom: 0.5rem !important;

      .markdown-content p {

      /* Bullet and Number Lists (Override Tailwind resets) */
      .markdown-content ul {

      }
      .markdown-content ol {

      .markdown-content li {
        margin-bottom: 0.25rem !important;

        color: #334155 !important;

        display: list-item !important;

      .markdown-content ul ul {
        list-style-type: circle !important;
        margin-top: 0.2rem !important;
        margin-bottom: 0.4rem !important;
        padding-left: 1.5rem !important;
      }
      .markdown-content ol ol {
        list-style-type: lower-alpha !important;
        margin-top: 0.2rem !important;

      /* Text alignments */
      .markdown-content .text-center {

      .markdown-content .text-right {
        text-align: right !important;

      }
      .markdown-content .text-left {
        text-align: left !important;
        display: block !important;

      /* Realistic grid tables exactly like MS Word */
      .markdown-content table { 
        width: 100% !important;

      .markdown-content tr:hover {

      /* A4 Paper Visual Styling */
      .a4-container {
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04) !important;
      }
      .a4-page {
        position: relative !important;

          margin: 0 auto !important;
          padding: 0 !important;
        }
        @page {

          margin: 0;
        }
      }
      #print-section {
        display: none;
      }
    </style>
