
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFO Brain - Hệ thống MIS Doanh nghiệp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --slate-50: #f8fafc;
        --slate-100: #f1f5f9;
        --slate-200: #e2e8f0;
        --slate-900: #0f172a;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--slate-50);
        color: var(--slate-900);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: -0.015em;
      }
      
      h1, h2, h3, h4, h5, h6, button, b, strong, .font-semibold, .font-bold, .font-black {
        letter-spacing: -0.025em;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Custom Scrollbar for other elements */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }

      .input-field {
        width: 100%;
        padding: 0.75rem 1.25rem;
        background-color: white;
        border: 1px solid var(--slate-200);
        border-radius: 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        outline: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .input-field:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08);
      }
      .btn-primary {
        background-color: var(--primary);
        color: white;
        padding: 0.75rem 1.75rem;
        border-radius: 1rem;
        font-weight: 700;
        font-size: 0.875rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.625rem;
        box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2);
      }
      .btn-primary:hover {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.25);
      }
      .btn-primary:active {
        transform: translateY(0);
      }

      /* Card Styling */
      .glass-card {
        background: white;
        border: 1px solid var(--slate-100);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.02);
        border-radius: 2rem;
      }

      /* Markdown Styling for AI responses */
      .markdown-content h1, .markdown-content h2 {
        font-weight: 900;
        color: var(--slate-900);
        margin-top: 2.5rem;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: -0.05em;
        font-size: 1.5rem;
      }
      .markdown-content h3 { 
        font-size: 1.125rem; 
        color: var(--primary); 
        font-weight: 900;
        margin-top: 2rem;
        margin-bottom: 0.75rem;
        text-transform: uppercase;
      }
      .markdown-content p { margin-bottom: 1rem; line-height: 1.7; color: #475569; font-weight: 500; }
      .markdown-content strong { font-weight: 800; color: var(--slate-900); }
      
      .markdown-content table { 
        width: 100%; 
        border-collapse: separate; 
        border-spacing: 0;
        margin: 2rem 0; 
        font-size: 0.875rem; 
        background: white;
        border-radius: 1.5rem;
        overflow: hidden;
        border: 1px solid var(--slate-100);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      .markdown-content th { 
        background: var(--slate-50); 
        padding: 1rem; 
        text-align: left; 
        font-weight: 900; 
        text-transform: uppercase; 
        letter-spacing: 0.05em;
        color: #64748b;
        border-bottom: 1px solid var(--slate-100);
      }
      .markdown-content td { 
        padding: 1rem; 
        border-bottom: 1px solid var(--slate-50); 
        color: #334155;
        font-weight: 600;
      }
      .markdown-content tr:last-child td { border-bottom: none; }
      .markdown-content tr:hover { background: var(--slate-50)/50; }

      /* Print Styles */
      @media print {
        body {
          background-color: white !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        #root {
          display: none !important;
        }
        #print-section {
          display: block !important;
          width: 80mm !important;
          margin: 0 auto !important;
          padding: 0 !important;
        }
        @page {
          size: 80mm auto;
          margin: 0;
        }
      }
      #print-section {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-section"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
