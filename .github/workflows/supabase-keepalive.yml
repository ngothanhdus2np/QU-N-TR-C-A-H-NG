name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ping Supabase projects
        env:
          SUPABASE_KEEPALIVE_TARGETS: ${{ secrets.SUPABASE_KEEPALIVE_TARGETS }}
        run: npm run supabase:keepalive
